# /etc/nginx/sites-available/sale-manager  – thay ten-mien.vn bằng tên miền / IP của VPS.
# Bật HTTPS miễn phí sau khi trỏ tên miền:  sudo certbot --nginx -d ten-mien.vn
server {
    listen 80;
    server_name ten-mien.vn;

    client_max_body_size 30m;          # ảnh BBGN ký nhận, ảnh phiếu, file Excel lịch sử

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;       # AI đọc ảnh phiếu có thể mất 1–2 phút
    }
}
